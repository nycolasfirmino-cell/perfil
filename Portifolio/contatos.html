<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Feedback - Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        /* Variáveis para facilitar a troca de cores se necessário */
        :root {
            --primary-color: #4461f2;
            --primary-hover: #334ecc;
            --dark-blue: #0d1b44;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            padding: 40px 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .form-container {
            max-width: 750px;
            background: rgba(255, 255, 255, 0.95);
            padding: 45px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(13, 27, 68, 0.08);
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease;
        }

        /* Estilização elegante para os labels */
        .form-label {
            font-weight: 600;
            color: var(--dark-blue);
            font-size: 0.9rem;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Inputs mais suaves e com transição no foco */
        .form-control,
        .form-select {
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            padding: 10px 15px;
            transition: all 0.3s ease;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(68, 97, 242, 0.15);
        }

        /* Ajuste específico para o input de cor */
        .form-control-color {
            padding: 6px;
            width: 80px;
            height: 45px;
            cursor: pointer;
        }

        /* Customização de Checkbox e Radio */
        .form-check-input:checked {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }

        .form-check-label {
            font-weight: 500;
            color: #4a5568;
            cursor: pointer;
        }

        /* Container de notas (1 a 10) estilizado em formato de botões de seleção */
        .rating-group {
            background: #f8fafc;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid #e2e8f0;
        }

        .rating-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: white;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            min-width: 45px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .rating-item:hover {
            border-color: var(--primary-color);
            background: rgba(68, 97, 242, 0.05);
        }

        /* Botão Enviar principal */
        .btn-enviar {
            background-color: var(--primary-color);
            border: none;
            padding: 12px 40px;
            border-radius: 50px;
            font-weight: 600;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(68, 97, 242, 0.3);
            transition: all 0.3s ease;
        }

        .btn-enviar:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(68, 97, 242, 0.4);
        }

        /* Botão Voltar limpo e funcional */
        .btn-voltar {
            border: 2px solid var(--primary-color);
            background: transparent;
            border-radius: 50px;
            padding: 8px 24px;
            transition: all 0.3s ease;
        }

        .btn-voltar a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            display: block;
        }

        .btn-voltar:hover {
            background-color: var(--primary-color);
        }

        .btn-voltar:hover a {
            color: white;
        }
    </style>
</head>

<body>

    <main class="container d-flex flex-column align-items-center">
        <div class="w-100 mb-4" style="max-width: 750px;">
            <button class="btn btn-voltar text-uppercase btn-sm">
                <a href="index.html"><i class="bi bi-arrow-left me-2"></i>Voltar</a>
            </button>
        </div>

        <div class="form-container w-100">
            <h2 class="text-center mb-5" style="color: #0d1b44; font-weight: 800; letter-spacing: -0.5px;">Formulário de
                Feedback</h2>

            <form>
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label for="firstName" class="form-label">Primeiro Nome:</label>
                        <input type="text" class="form-control" id="nome" placeholder="John">
                    </div>
                    <div class="col-md-6">
                        <label for="lastName" class="form-label">Último Nome:</label>
                        <input type="text" class="form-control" id="ultimoNome" placeholder="Doe">
                    </div>
                </div>

                <div class="mb-4">
                    <label for="email" class="form-label">Email:</label>
                    <input type="email" class="form-control" id="email" placeholder="nome@exemplo.com">
                </div>

                <div class="mb-4">
                    <label class="form-label d-block">Cor favorita?</label>
                    <input type="color" class="form-control form-control-color" id="favColor" value="#4461f2">
                </div>

                <div class="mb-4">
                    <label for="skill" class="form-label">Qual habilidade mais te interessa?</label>
                    <select class="form-select" id="skill">
                        <option selected disabled>Escolha uma opção...</option>
                        <option value="1">Desenvolvimento</option>
                        <option value="2">Design</option>
                        <option value="3">Front-End</option>
                        <option value="4">Back-End</option>
                        <option value="5">Relampago Marquinhos</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label d-block">Quais linguagem de programação você gosta mais?</label>
                    <div class="row g-2">
                        <div class="col-6 col-sm-4">
                            <div class="form-check card p-2 px-3 border-1">
                                <input class="form-check-input" type="checkbox" id="rock">
                                <label class="form-check-label ms-1" for="rock">Java</label>
                            </div>
                        </div>
                        <div class="col-6 col-sm-4">
                            <div class="form-check card p-2 px-3 border-1">
                                <input class="form-check-input" type="checkbox" id="pop" checked>
                                <label class="form-check-label ms-1" for="pop">Python</label>
                            </div>
                        </div>
                        <div class="col-6 col-sm-4">
                            <div class="form-check card p-2 px-3 border-1">
                                <input class="form-check-input" type="checkbox" id="classic">
                                <label class="form-check-label ms-1" for="classic">Golang</label>
                            </div>
                        </div>
                        <div class="col-6 col-sm-4">
                            <div class="form-check card p-2 px-3 border-1">
                                <input class="form-check-input" type="checkbox" id="electro">
                                <label class="form-check-label ms-1" for="electro">Rust</label>
                            </div>
                        </div>
                        <div class="col-6 col-sm-4">
                            <div class="form-check card p-2 px-3 border-1">
                                <input class="form-check-input" type="checkbox" id="other">
                                <label class="form-check-label ms-1" for="other">Node.JS</label>
                            </div>
                        </div>
                        <div class="col-6 col-sm-4">
                            <div class="form-check card p-2 px-3 border-1">
                                <input class="form-check-input" type="checkbox" id="other">
                                <label class="form-check-label ms-1" for="other">Outra</label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mb-5">
                    <label class="form-label d-block">Qual nota daria para este perfil?</label>
                    <div class="rating-group d-flex flex-wrap justify-content-between gap-2">
                        <label class="rating-item">
                            <span class="fw-bold mb-1">1</span>
                            <input class="form-check-input m-0" type="radio" name="rating" value="1">
                        </label>
                        <label class="rating-item">
                            <span class="fw-bold mb-1">2</span>
                            <input class="form-check-input m-0" type="radio" name="rating" value="2">
                        </label>
                        <label class="rating-item">
                            <span class="fw-bold mb-1">3</span>
                            <input class="form-check-input m-0" type="radio" name="rating" value="3">
                        </label>
                        <label class="rating-item">
                            <span class="fw-bold mb-1">4</span>
                            <input class="form-check-input m-0" type="radio" name="rating" value="4">
                        </label>
                        <label class="rating-item">
                            <span class="fw-bold mb-1">5</span>
                            <input class="form-check-input m-0" type="radio" name="rating" value="5">
                        </label>
                        <label class="rating-item">
                            <span class="fw-bold mb-1">6</span>
                            <input class="form-check-input m-0" type="radio" name="rating" value="6">
                        </label>
                        <label class="rating-item">
                            <span class="fw-bold mb-1">7</span>
                            <input class="form-check-input m-0" type="radio" name="rating" value="7">
                        </label>
                        <label class="rating-item">
                            <span class="fw-bold mb-1">8</span>
                            <input class="form-check-input m-0" type="radio" name="rating" value="8">
                        </label>
                        <label class="rating-item">
                            <span class="fw-bold mb-1">9</span>
                            <input class="form-check-input m-0" type="radio" name="rating" value="9">
                        </label>
                        <label class="rating-item">
                            <span class="fw-bold mb-1">10</span>
                            <input class="form-check-input m-0" type="radio" name="rating" value="10">
                        </label>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="comment" class="form-label">Adicione um comentário:</label>
                    <textarea class="form-control" id="comment" rows="3"
                        placeholder="Sua mensagem adicional aqui..."></textarea>
                </div>

                <div class="text-center mt-4">
                    <button type="button" class="btn btn-primary btn-enviar text-uppercase" onclick="enviarEmail()">
                        <i class="bi bi-send-fill me-2"></i> Enviar Feedback
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

<script>
    function enviarEmail() {
        const nome = document.getElementById('nome').value;
        const ultimoNome = document.getElementById('ultimoNome').value;
        const email = document.getElementById('email').value;

        if (!nome || !ultimoNome || !email) {
            alert("Por favor, preencha todos os campos antes de enviar.");
            return;
        }

        const emailDestino = "nycolas.firmino@aluno.senai.br";
        const assunto = encodeURIComponent(`Proposta de Vaga: ${ultimoNome}`);
        const corpoEmail = encodeURIComponent(`Olá, meu nome é ${nome}.\n\nMensagem/Proposta:\n${email}`);

        const urlGmail = `https://mail.google.com/mail/?view=cm&fs=1&to=${emailDestino}&su=${assunto}&body=${corpoEmail}`;

        window.open(urlGmail, '_blank');
    }
</script>

</html>
